<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Movie Taste Map</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 6px;
      z-index: 10;
    }

    #sigma-container {
      width: 100vw;
      height: 100vh;
    }

    button {
      margin: 2px;
    }
  </style>
</head>
<body>

<div id="controls">
  <button id="zoom-in">+</button>
  <button id="zoom-out">−</button>
  <button id="zoom-reset">Reset</button>
  <button id="toggle-edges" aria-pressed="false">Edges: On</button>
  <br /><br />
  <label>
    Labels:
    <input id="labels-threshold" type="range" min="0" max="20" step="1" />
  </label>
</div>

<div id="sigma-container"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
